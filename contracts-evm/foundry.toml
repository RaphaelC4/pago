[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# Split3's exhaustive check evaluates the whole 2^15 input space through the
# TAP-02 evaluator, which costs far more than Foundry's ~1.07e9 default per
# test. The check is a bounded loop with an asserted gate count, so there is
# nothing to hang on: the ceiling is raised (and the frame's memory budget
# with it) rather than the claim "exhaustive" being quietly narrowed.
gas_limit = 9223372036854775807
memory_limit = 134217728

[rpc_endpoints]
xlayer = "${XLAYER_RPC}"
