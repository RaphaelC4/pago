<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pago — Send a link. Get paid on X Layer.</title>
<meta name="description" content="Pago turns a payment request into a link, paid in stablecoins on X Layer.">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23010100'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css?v=20261124d">
  <!-- A settled invoice renders the same card as an open one — payee row,
       status pill, amount, "for" line, invoice table — with the payout
       result taking the pay button's place underneath. That result is
       styled here: styles.css is frozen, and its #claimReceipt rules belong
       to the site's static proof receipt, which this document never
       renders. The PDF button stays live — unlike the homepage's static
       copy, this page can actually read the claim events to build it. -->
  <style>
    /* ── payout result: the card's own rows, where the pay button was ── */
    .pay-result{display:grid;gap:1rem}
    .pay-result-ok{display:flex;align-items:center;gap:.6rem;margin:0;font-size:15px}
    .pay-result-ok strong{font-weight:600}
    .pay-result-ok .chk{
      flex:none;display:inline-flex;align-items:center;justify-content:center;
      width:25px;height:25px;border-radius:50%;
      background:#bcff2f;color:#15180d;
    }
    /* The invoice table already printed these figures from stored state;
       inside the result the same rows are read back from the claim's own
       events, so they are separated by spacing rather than boxed off. */
    .pay-result .pay-items{margin-top:0;padding-top:0;border-top:0}
    /* The result's values carry full amounts and addresses; let them wrap
       rather than push the card sideways on a 360px screen. */
    .pay-result .pi-p{white-space:normal;overflow-wrap:anywhere}
    /* styles.css frames #claimRows as part of the old receipt slab; here it
       is the card's own row list — unframed, and absent until the events
       actually land (`:empty` covers the read in flight and a failed one). */
    #claimRows{display:block;padding:0;border:0;border-radius:0;background:transparent}
    #claimRows:empty{display:none}
    .pay-result-foot{display:grid;gap:.8rem}
    .pay-result-foot .tiny{line-height:1.5}
    #claimPdf{
      width:100%;min-height:44px;border:0;border-radius:999px;
      background:#bcff2f;color:#15180d;
      box-shadow:0 5px 22px rgba(188,255,47,.13);
      font-size:13px;font-weight:700;
    }
    #claimPdf:hover{background:#d0ff72;opacity:1}
    /* The header is the site's header — the two section links between the
       mark and the network / wallet group. styles.css's .btn is the plain
       light one, so the lime the site's bar wears is restated here, and the
       group takes the right edge the way the site's does (there its
       .site-nav absorbs the free space; this page has no nav to carry it). */
    .header-right{margin-left:auto}
    .header-right .btn{background:#bcff2f;border-color:#bcff2f;color:#0d1204;font-weight:600}
    .lp-appbar{display:flex;align-items:center;gap:.5rem;margin:0;flex:none}
    /* Phones: only the two links and the wallet circle fit one row, so the
       network readout steps out here the way it does on the site — the
       card's amount block and the footer still name the network. */
    @media (max-width:560px){
      .lp-appbar .net-pill{display:none}
      .brand-name{display:none}
    }
    /* One pill, one style — the same network readout the site header uses.
       styles.css carries the base .network-select (its own border, radius and
       padding), so those are overridden here: the select sits absolutely over
       the whole pill at opacity 0 and takes the tap, while the dot + label
       underneath do the visible work. The pill shows at every width — unlike
       .net-chip, which styles.css drops below 760px. */
    .net-pill{
      position:relative;display:inline-flex;align-items:center;gap:.45rem;
      border:1px solid var(--line);border-radius:999px;
      padding:.34rem .7rem .34rem .62rem;
      font-size:12px;color:var(--muted);flex:none;white-space:nowrap;
    }
    .net-pill::after{
      content:"";flex:none;width:7px;height:7px;margin-left:.15rem;opacity:.65;
      border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
      translate:0 -2px;rotate:45deg;
    }
    .net-pill:focus-within{border-color:rgba(255,255,255,.32)}
    .net-pill .network-select{
      position:absolute;inset:0;width:100%;height:100%;
      min-height:0;max-width:none;padding:0;margin:0;
      border:0;background:transparent;opacity:0;cursor:pointer;
    }
    /* The claim's seat rows carry the same local portrait the create form
       rotates, laid out in the card's row language: portrait and seat in
       the label with the address underneath it, amount in the value. */
    .rcpt-seat{display:flex;align-items:center;gap:.45rem;min-width:0}
    .rcpt-seat-txt{display:grid;min-width:0;font-size:13px;line-height:1.35}
    .rcpt-seat-txt i{font-style:normal;font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
    .rcpt-avatar{
      flex:none;width:20px;height:20px;border-radius:50%;
      object-fit:cover;object-position:50% 30%;
      background:#141413;box-shadow:0 0 0 1.5px rgba(255,255,255,.16);
    }
    /* One-recipient links (handoff §7): one plain sentence at the very top
       of the card, the full rule/default/cap/fallback detail one click away
       in "Payment details" — collapsed by default, never removed. Only the
       sentence is namespaced to .pay-nosplit; the rule block's own styles
       sit un-scoped below, because a multi-recipient card prints that block
       in the open with no .pay-details wrapper around it. */
    .pay-nosplit{
      border:1px solid rgba(188,255,47,.28);
      border-radius:var(--r-lg,14px);
      background:rgba(188,255,47,.05);
      padding:1rem 1.1rem;margin-bottom:1.2rem;
    }
    .pay-nosplit-line{margin:0;font-size:15px;line-height:1.5;font-weight:500}
    .pay-nosplit-addr{overflow-wrap:anywhere;word-break:break-all;font-size:13px;opacity:.9}
    .pay-nosplit-sub{margin:.4rem 0 0;font-size:13px;line-height:1.45;color:var(--muted)}
    .pay-details{margin-top:1.15rem;border-top:1px solid var(--line);padding-top:.9rem}
    .pay-details summary{
      cursor:pointer;list-style:none;display:flex;align-items:center;gap:.5rem;
      font-size:13px;font-weight:500;color:var(--muted);
    }
    .pay-details summary::-webkit-details-marker{display:none}
    .pay-details summary::after{
      content:"";width:6px;height:6px;flex:none;opacity:.7;
      border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
      rotate:45deg;transition:rotate .15s ease;
    }
    .pay-details[open] summary::after{rotate:225deg}
    .pay-details summary:focus-visible{outline:2px solid rgba(188,255,47,.8);outline-offset:3px;border-radius:4px}
    /* The rule block ships without styles.css rules (styles.css is frozen),
       so it carries its own — OKX Wallet's standard, the same language the
       create form wears: a pure-black card on the page's near-black, a
       hairline border, uppercase micro-labels, dark chips, lime only on the
       tag, mono for whatever the chain served. Deliberately not scoped to
       .pay-details: a multi-recipient card prints this block in the open,
       and it has to read the same either way. */
    .pay-rule-card{
      margin-top:1.1rem;background:#000;
      border:1px solid rgba(255,255,255,.09);border-radius:14px;
      padding:.95rem 1.05rem;display:grid;gap:.75rem;
      font-size:13px;line-height:1.5;
    }
    .pay-rule-title{display:flex;justify-content:space-between;gap:.7rem;align-items:center}
    .pay-rule-title>span:first-child{font-size:14px;font-weight:650;letter-spacing:-.01em}
    .rule-tag{
      font-size:10.5px;font-weight:600;color:#bcff2f;
      border:1px solid rgba(188,255,47,.35);background:rgba(188,255,47,.06);
      border-radius:999px;padding:.15rem .55rem;
      text-transform:uppercase;letter-spacing:.08em;
    }
    .pay-rule-row{display:grid;grid-template-columns:7rem 1fr;gap:.5rem .75rem;align-items:start}
    .pay-rule-row>div{min-width:0}
    .pay-rule-row b{
      padding-top:.15rem;font-size:11px;font-weight:600;color:var(--muted);
      text-transform:uppercase;letter-spacing:.09em;
    }
    .rule-share-list{display:flex;flex-wrap:wrap;gap:.35rem;margin:.4rem 0}
    .rule-share-list span{
      font-size:12px;border:1px solid rgba(255,255,255,.09);border-radius:999px;
      padding:.15rem .55rem;color:#f4f4f3;background:#141413;
      font-variant-numeric:tabular-nums;
    }
    .rule-note{display:block;margin:.3rem 0 0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
    .rule-fallback{
      margin:0;font-size:12px;color:var(--muted);
      border-top:1px solid rgba(255,255,255,.07);padding-top:.65rem;
    }
    /* After the base rules on purpose: at equal specificity the later rule
       wins, so this query has to sit below them to actually stack. The label
       column is a luxury a phone cannot afford — the rows stack, and the
       chips and hashes get the card's full width instead of a narrow ribbon
       beside the label. */
    @media (max-width:560px){
      .pay-rule-row{grid-template-columns:1fr;gap:.2rem}
      .pay-rule-row b{padding-top:0}
    }
  </style>
<!-- Same three weights the first screen uses, preloaded for the same reason. -->
<link rel="preload" href="fonts/satoshi-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/satoshi-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/satoshi-700.woff2" as="font" type="font/woff2" crossorigin>
<!-- Reads go out to this endpoint before the script can even run; saying so
     here saves a DNS round trip on the first eth_call. -->
<link rel="preconnect" href="https://rpc.xlayer.tech">
</head>
<body>

<!-- Original Pago dollar coin mark. Kept inline so it stays crisp at every size. -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="coin-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9FF72"/>
      <stop offset="1" stop-color="#A9E91A"/>
    </linearGradient>
    <symbol id="coin-stable" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="15.25" fill="#111610" stroke="#D2FF57" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="11.75" fill="url(#coin-core)"/>
      <path d="M21.1 11.4c-.8-1.5-2.5-2.3-5-2.3-3 0-5 1.3-5 3.3 0 4.6 9.1 2.1 9.1 5.8 0 1.8-1.8 3.1-4.9 3.1-2.3 0-4.1-.8-5.1-2.2M16 6.7v18.6" fill="none" stroke="#13180D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M7.8 12.2a8.8 8.8 0 0 1 12.1-4.7" fill="none" stroke="#FFFFFF" stroke-opacity=".38" stroke-width=".8" stroke-linecap="round"/>
    </symbol>
    <symbol id="coin-share" viewBox="0 0 16 16">
      <path d="M11.5 5.2A2.1 2.1 0 1 0 11.5 1a2.1 2.1 0 0 0 0 4.2zM4.5 8.1a2.1 2.1 0 1 0 0-4.2 2.1 2.1 0 0 0 0 4.2zM11.5 15a2.1 2.1 0 1 0 0-4.2 2.1 2.1 0 0 0 0 4.2zM6.4 9.1l3.2 1.8M9.6 5.1 6.4 6.9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>

<header class="site-header">
  <div class="wrap header-inner">
    <!-- The site's bar, carried over: the mark is the way home, the two
         section links lead to the pages that own them (xlayer.js sends the
         click across — this document has no create or ledger panel), and
         the network + wallet group sits at the edge as it does on
         pago-onboarding.html. -->
    <a class="brand" href="pago-onboarding.html" aria-label="Pago home">
      <span class="brand-mark" aria-hidden="true">
        <svg class="logo-pago" width="26" height="26" viewBox="0 0 32 32"><use href="#coin-stable"/></svg>
      </span>
      <span class="brand-name">Pago</span>
    </a>

    <div class="header-right">
      <a class="btn btn-sm" data-tab="create" href="pago-onboarding.html#create"><span>Create a link</span></a>
      <a class="btn btn-sm" data-tab="ledger" href="pago-onboarding.html#ledger"><span>My links</span></a>
      <div class="lp-appbar">
        <!-- One pill carries the whole network readout — status dot, the label
             xlayer.js paints (including "chain unreachable" when the RPC dies)
             and the selector laid transparently over it, so tapping anywhere on
             the pill opens the real network menu. Same pill as the site header. -->
        <span class="net-pill">
          <span class="dot js-netdot" id="netDot" aria-hidden="true"></span>
          <span id="netLabel">X Layer</span>
          <select class="network-select" id="networkSelect" aria-label="X Layer network"></select>
        </span>
        <button class="btn btn-sm" id="walletBtn" type="button">
          <svg class="wallet-ico" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M2.5 5A1.5 1.5 0 0 1 4 3.5h8A1.5 1.5 0 0 1 13.5 5v6A1.5 1.5 0 0 1 12 12.5H4A1.5 1.5 0 0 1 2.5 11Z"/><path d="M13.5 6.6H10.8a1.6 1.6 0 0 0 0 3.2h2.7"/></svg>
          <span id="walletLabel">Connect</span>
        </button>
      </div>
    </div>
  </div>
</header>

<main id="top">

  <!-- ============================== PAY ==============================
       The only panel this document owns: route() sends every other hash
       (bare, #home, #create, #ledger, #ready/…) to the site. The skeleton
       is the loading state, so it paints before the script runs. -->
  <section class="panel" id="panel-pay" data-panel="pay">
    <div class="wrap wrap-pay">
      <div class="pay-card" id="payCard">
        <span class="eyebrow">payment request</span>
        <div class="skeleton-block" aria-hidden="true"></div>
        <div class="skeleton-block sk-lg" aria-hidden="true"></div>
        <div class="skeleton-block sk-w50" aria-hidden="true"></div>
        <p class="sr-status" role="status">Reading the chain&hellip;</p>
      </div>
      <div class="tx-line" id="payStatus" hidden></div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bar">
      <span>&copy; 2026 Pago</span>
      <span class="mono" id="footerNetworkLabel">X Layer</span>
    </div>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- One module runs both documents; here it boots the payment card alone.
     The share card's QR helper lives with the site, which owns sharing now. -->
<script type="module" src="xlayer.js?v=20261124c"></script>
</body>
</html>
